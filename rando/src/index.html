<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Detective Board</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0c10;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        #game-container {
            width: 720px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #screen-wrapper {
            position: relative;
            width: 720px;
            height: 405px; /* 16:9 pixel aspect ratio */
            border: 3px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Keeps iPad pixel art crisp */
            display: block;
        }

        #fade-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #terminal-container {
            width: 720px;
            height: 180px;
            background-color: #161b22;
            border: 2px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        #terminal-history {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
            color: #8b949e;
        }

        .terminal-input-row {
            display: flex;
            align-items: center;
            margin-top: 6px;
        }

        .prompt {
            color: #e1b12c;
            margin-right: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        #terminal-input {
            background: transparent;
            border: none;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Story Screen -->
        <div id="screen-wrapper">
            <canvas id="gameCanvas" width="640" height="360"></canvas>
            <div id="fade-overlay"></div>
        </div>

        <!-- Terminal on Bottom -->
        <div id="terminal-container">
            <div id="terminal-history"></div>
            <div class="terminal-input-row">
                <span class="prompt">detective@case-files:~$</span>
                <input type="text" id="terminal-input" autofocus autocomplete="off" />
            </div>
        </div>
    </div>

    <script src="src/story.js"></script>
    <script src="src/game.js"></script>
    <script src="src/terminal.js"></script>
</body>
</html>
