<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Detective Board</title>
    <style>
        body {
            background-color: #0f1115;
            color: #c9d1d9;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .controls-bar {
            width: 560px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        select {
            background: #161b22;
            color: #e1b12c;
            border: 1px solid #30363d;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        canvas {
            border: 2px solid #30363d;
            border-radius: 6px;
            background-color: #1a1614;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        #terminal-container {
            width: 560px;
            height: 180px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        #terminal-history {
            flex-grow: 1;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #8b949e;
        }

        .terminal-input-row {
            display: flex;
            align-items: center;
            margin-top: 6px;
        }

        .prompt {
            color: #2ea44f;
            margin-right: 8px;
            font-size: 12px;
        }

        #terminal-input {
            background: transparent;
            border: none;
            color: #58a6ff;
            font-family: monospace;
            font-size: 12px;
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="controls-bar">
            <div>
                <label for="level-select" style="font-size: 12px; color: #8b949e; margin-right: 6px;">SELECT CASE:</label>
                <select id="level-select" onchange="switchLevel(this.value)">
                    <option value="Level1">🕵️ Case #101: Bank Vault Heist</option>
                    <option value="Sandbox">🧪 Sandbox: Desk Practice</option>
                </select>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-size: 12px; cursor: pointer; color: #8b949e;">
                    <input type="checkbox" id="toggle-coords" onchange="toggleAdminCoords(this)"> 📐 Coordinates
                </label>
                <span id="admin-status" style="font-size: 11px; font-family: monospace;"></span>
            </div>
        </div>

        <canvas id="gameCanvas" width="560" height="280"></canvas>

        <div id="terminal-container">
            <div id="terminal-history"></div>
            <div class="terminal-input-row">
                <span class="prompt">detective@case-files:~$</span>
                <input type="text" id="terminal-input" autofocus autocomplete="off" />
            </div>
        </div>
    </div>

    <script src="src/sandbox.js"></script>
    <script src="src/level_1.js"></script>
    <script src="src/game.js"></script>
    <script src="src/terminal.js"></script>
</body>
</html>
